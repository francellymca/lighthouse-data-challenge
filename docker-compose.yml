services:
  postgres:
    image: postgres:16
    container_name: lighthouse-postgres
    environment:
      POSTGRES_DB: lh_nautical
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - lighthouse_postgres_data:/var/lib/postgresql/data

volumes:
  lighthouse_postgres_data: